<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gdzie otworzyć?</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Panel boczny: na telefonie staje się arkuszem na dole ekranu -->
  <aside id="sidebar">
    <button id="sheet-handle" type="button" aria-label="Zwiń lub rozwiń panel"></button>
    <h1>Gdzie otworzyć?</h1>

    <!-- Obszar analizy = to, co widać na mapie; wyszukiwarka tylko przenosi mapę w wybrane miejsce -->
    <div id="search-wrap">
      <input id="search-input" type="search" placeholder="Przejdź do adresu lub miejscowości" autocomplete="off"
             aria-label="Przejdź do adresu lub miejscowości">
      <ul id="search-results" hidden></ul>
    </div>

    <label for="type-select">Typ działalności</label>
    <select id="type-select"></select>

    <label for="demand-select">Czynnik popytu</label>
    <select id="demand-select"></select>

    <div id="months-row" hidden>
      <label for="months-select">Okres pozwoleń</label>
      <select id="months-select">
        <option value="12">ostatnie 12 miesięcy</option>
        <option value="24" selected>ostatnie 24 miesiące</option>
        <option value="36">ostatnie 36 miesięcy</option>
      </select>
    </div>

    <div class="label-row">
      <label for="bandwidth-input">Zasięg klienta: <b id="bandwidth-value">1,5</b> km</label>
      <button type="button" class="help" data-help="range" aria-label="Co to jest zasięg klienta?">?</button>
    </div>
    <!-- Suwak logarytmiczny: pozycja 0–100 odpowiada 0,1–20 km (wzór w ui.js) -->
    <input id="bandwidth-input" type="range" min="0" max="100" step="1" value="50">

    <div id="info" class="info" role="status" hidden></div>
    <div id="error" role="alert" hidden></div>

    <h2 id="top-title">Najlepsze miejsca</h2>
    <ol id="top-list"><li class="muted">Wybierz typ działalności albo czynnik popytu.</li></ol>

    <div id="warnings" hidden></div>
    <div id="notes" hidden></div>
    <footer id="meta-footer"></footer>
  </aside>

  <main id="map"></main>
  <div id="loading-bar" hidden></div>

  <!-- Przełącznik warstw i legenda (kontrolki nad mapą) -->
  <div id="map-controls">
    <div id="layer-switch">
      <div class="layer-row">
        <label><input type="radio" name="layer" value="score" checked> Okazja</label>
        <button type="button" class="help" data-help="score" aria-label="Co to jest Okazja?">?</button>
      </div>
      <div class="layer-row">
        <label><input type="radio" name="layer" value="D"> Popyt</label>
        <button type="button" class="help" data-help="D" aria-label="Co to jest Popyt?">?</button>
      </div>
      <div class="layer-row">
        <label><input type="radio" name="layer" value="S"> Konkurencja</label>
        <button type="button" class="help" data-help="S" aria-label="Co to jest Konkurencja?">?</button>
      </div>
    </div>
    <label class="check"><input id="poi-checkbox" type="checkbox"> Punkty firm</label>
    <div id="poi-note" class="hint" hidden></div>
    <label class="opacity">Przezroczystość
      <input id="opacity-input" type="range" min="0.2" max="1" step="0.05" value="0.7">
    </label>
    <div id="legend" hidden></div>
  </div>

  <div id="help-popover" role="tooltip" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
